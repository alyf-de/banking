<li class="brr-reorder__item" data-name="{{ name }}" data-priority-st="{{ status }}">
	<span class="brr-reorder__handle">{{ drag_icon }}</span>
	<span class="brr-reorder__label"><strong>{{ name }}</strong>{% if target_account %} - {{ target_account }}{% endif %}</span>
	<span class="text-muted small brr-reorder__prio">P {{ priority }}</span>
</li>
